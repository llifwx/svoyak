<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Своя игра</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#060b26;--bg2:#0d1a52;--cell:#1d47c4;--cell-hi:#3a6bff;--cell2:#0f2470;--gold:#ffd54a;--gold2:#ffb300;--fg:#f4f6ff;--muted:#9fb0e0;--card:rgba(20,32,92,.72);--line:rgba(140,165,255,.18);--ok:#1fb86a;--bad:#e0464b;--r:14px}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--fg);font:16px/1.45 Manrope,system-ui,sans-serif;
  background:radial-gradient(1200px 600px at 50% -10%,#2a44b8 0,transparent 60%),radial-gradient(900px 500px at 100% 110%,#3b1a7a 0,transparent 60%),linear-gradient(var(--bg2),var(--bg));background-attachment:fixed}
h1,h2,.logo,.special,.cell,.pscore,.win{font-family:"Russo One",Manrope,sans-serif;font-weight:400}
button,.btnlike{font:700 15px/1 Manrope,sans-serif;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;color:#fff;display:inline-block;text-align:center;
  background:linear-gradient(180deg,#4b7bff,#2a52d9);box-shadow:0 6px 18px -6px rgba(60,100,255,.7),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .12s,filter .12s,box-shadow .12s}
button:hover:not(:disabled),.btnlike:hover{filter:brightness(1.12);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,.btnlike:focus-within,input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:2px}
.ghost{background:rgba(255,255,255,.04);border:1px solid var(--line);box-shadow:none}
.ghost:hover{background:rgba(255,255,255,.09)}
.ok{background:linear-gradient(180deg,#2bd17d,var(--ok));box-shadow:0 6px 18px -8px var(--ok)}
.bad{background:linear-gradient(180deg,#f2605f,var(--bad));box-shadow:0 6px 18px -8px var(--bad)}
input,textarea,select{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(4,10,40,.55);color:var(--fg);min-width:0;transition:border-color .15s}
input::placeholder,textarea::placeholder{color:#6f7fb5}
input:hover,textarea:hover,select:hover{border-color:rgba(160,185,255,.4)}
textarea{resize:vertical;min-height:42px}
.hidden{display:none!important}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.center{justify-content:center}
header{display:flex;gap:10px;padding:16px 20px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);background:rgba(6,11,38,.5);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
header h1{margin:0 auto 0 0;font-size:24px;color:var(--gold);letter-spacing:.04em}
main{padding:0 16px 40px;max-width:1100px;margin:auto}
.center-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:100vh;padding:16px}
.center-screen h2{margin:0;font-size:32px;color:var(--gold)}
.logo{font-size:clamp(44px,10vw,104px);margin:0 0 12px;letter-spacing:.06em;line-height:1;text-align:center;
  background:linear-gradient(180deg,#fff6c8 0,var(--gold) 45%,var(--gold2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 #7a5400) drop-shadow(0 0 40px rgba(255,200,60,.35))}
.menu-btns{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.menu-btns>:first-child{font-size:18px;padding:16px;background:linear-gradient(180deg,#ffe27a,var(--gold2));color:#2a1c00;box-shadow:0 10px 30px -8px rgba(255,190,40,.6),inset 0 1px 0 rgba(255,255,255,.6)}
/* editor */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:18px 0;backdrop-filter:blur(6px);box-shadow:0 20px 40px -24px #000}
.card h2{margin:0 0 8px;color:var(--gold)}
.card>.row input{flex:1;font-family:"Russo One",Manrope,sans-serif;font-size:22px;color:var(--gold)}
.theme{background:rgba(4,10,40,.3);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;margin-top:14px;padding:12px}
.theme>.row input{flex:1;font-size:17px;font-weight:800}
.q{display:grid;grid-template-columns:90px 170px 1fr 1fr 120px 40px;gap:8px;align-items:start;padding:6px;border-radius:12px;transition:background .15s}
.q:hover{background:rgba(255,255,255,.04)}
.qh{padding:10px 6px 0;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.qh:hover{background:none}
.q>input[type=number]{color:var(--gold);font-weight:800;text-align:center;font-size:18px}
.q textarea{field-sizing:content;min-height:44px}
.q textarea:nth-of-type(2){border-color:rgba(255,213,74,.25);background:rgba(255,213,74,.05)}
.img-pick{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.pick{padding:11px 10px;font-size:13px;font-weight:700;border-radius:10px;border:1px dashed var(--line);color:var(--muted);text-align:center;cursor:pointer;transition:border-color .15s,color .15s}
.pick:hover{border-color:var(--gold);color:var(--gold)}
.thumbwrap{position:relative}
.thumb{display:block;width:100%;max-height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbwrap button{position:absolute;top:4px;right:4px;padding:4px 7px;font-size:11px}
.del{background:transparent;border:1px solid rgba(224,70,75,.35);color:#ff8a8d;box-shadow:none}
.del:hover:not(:disabled){background:var(--bad);color:#fff}
.q>.del{padding:0;height:44px}
.addround{width:100%;padding:16px;background:transparent;border:2px dashed var(--line);color:var(--muted);box-shadow:none}
.addround:hover{border-color:var(--gold);color:var(--gold)}
@media(max-width:800px){.q{grid-template-columns:1fr 1fr!important}.qh{display:none}}
/* setup */
#plist{display:flex;flex-direction:column;gap:8px;width:min(360px,100%)}
#plist .row{flex-wrap:nowrap}
#plist .row input{flex:1;font-size:17px;font-weight:700;padding:12px 14px}
/* game */
#game{display:flex;flex-direction:column;height:100vh;overflow:auto}
#board{display:grid;gap:8px;padding:20px;flex:1;grid-auto-rows:1fr}
#board .tname{font-size:clamp(14px,1.6vw,24px)}
#board .cell{font-size:clamp(24px,4.5vw,64px)}
.tname,.cell{border-radius:var(--r);min-height:72px;display:flex;align-items:center;padding:8px 14px}
.tname{background:linear-gradient(180deg,#14307f,var(--cell2));border:1px solid var(--line);font-weight:800;text-transform:uppercase;font-size:14px;letter-spacing:.04em;line-height:1.2}
.cell{justify-content:center;color:var(--gold);font-size:clamp(22px,3.2vw,38px);letter-spacing:.02em;text-shadow:0 2px 0 #7a5400,0 0 18px rgba(255,200,60,.35);
  background:radial-gradient(120% 90% at 50% 0,var(--cell-hi),var(--cell) 55%,#13309a);border:1px solid rgba(160,190,255,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 20px -10px #000;transition:transform .15s,box-shadow .15s,filter .15s}
.cell:hover:not(:disabled){transform:translateY(-3px) scale(1.03);filter:brightness(1.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 2px var(--gold),0 14px 30px -10px rgba(255,200,60,.5)}
.cell:disabled{opacity:1;background:rgba(10,20,70,.55);border:1px dashed var(--line);box-shadow:none}
#scores{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:8px 16px 24px}
.player{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 18px 8px;text-align:center;min-width:150px;backdrop-filter:blur(6px);box-shadow:0 12px 30px -16px #000}
.pname{color:var(--muted);font-weight:700;text-transform:uppercase;font-size:13px;letter-spacing:.08em}
.pscore{background:transparent;border:0;color:var(--gold);font-size:30px;text-align:center;width:140px;padding:2px;-moz-appearance:textfield}
.pscore::-webkit-inner-spin-button,.pscore::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
/* modal */
#modal{position:fixed;inset:0;z-index:10;display:flex;overflow:auto;
  background:radial-gradient(1200px 700px at 50% 0,rgba(50,80,220,.5),transparent 70%),linear-gradient(var(--bg2),var(--bg))}
#mbody{width:100%;min-height:100%;display:flex;flex-direction:column;gap:24px;align-items:center;text-align:center;padding:24px clamp(16px,4vw,48px);
  animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
#mbody>:first-child{margin-top:auto}
#mbody>:last-child{margin-bottom:auto}
#mbody>.mfoot{margin:auto 0 0;width:100%;display:flex;flex-direction:column;gap:14px;align-items:center;padding-top:18px;border-top:1px solid var(--line)}
.mfoot .judge{flex-direction:row;flex-wrap:wrap;justify-content:center;width:100%}
.mfoot .jrow{flex:0 1 340px}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}
.qhead{color:var(--gold);text-transform:uppercase;letter-spacing:.12em;font-weight:800;font-size:14px;padding:6px 14px;border:1px solid rgba(255,213,74,.35);border-radius:999px}
.qhead{font-size:clamp(14px,1.4vw,20px)}
.qtext{font-size:clamp(28px,5vw,72px);font-weight:700;white-space:pre-wrap;line-height:1.25;max-width:1400px}
.qimg{max-width:100%;max-height:60vh;border-radius:14px;box-shadow:0 16px 40px -16px #000}
.answer{font-size:clamp(24px,3vw,44px);color:var(--gold);font-weight:800;padding:12px 22px;border-radius:14px;background:rgba(255,213,74,.08);border:1px solid rgba(255,213,74,.3);animation:pop .3s}
.special{font-size:clamp(34px,6vw,60px);color:var(--gold);margin:0;text-shadow:0 4px 0 #7a5400,0 0 30px rgba(255,200,60,.4)}
.judge{display:flex;flex-direction:column;gap:8px;width:min(560px,100%)}
.jrow{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;padding:8px 8px 8px 16px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.jrow span{margin-right:auto;padding-right:16px;font-weight:700;text-align:left}
.jrow input{width:120px}
#res{display:flex;flex-direction:column;gap:10px;align-items:center}
.res{font-size:24px;font-weight:700;padding:10px 24px;border-radius:14px;background:var(--card);border:1px solid var(--line);min-width:min(420px,90vw);text-align:center}
.win{font-size:clamp(28px,5vw,44px);color:#2a1c00;background:linear-gradient(180deg,#ffe27a,var(--gold2));border:0;box-shadow:0 0 50px -6px rgba(255,190,40,.6);animation:pop .5s}
/* кнопки на телефонах */
.jrow.first{border-color:var(--gold);background:rgba(255,213,74,.14);box-shadow:0 0 0 2px var(--gold),0 0 30px rgba(255,200,60,.4);animation:pop .3s}
.jrow.first span::before{content:'🔔 '}
.qr{background:#fff;padding:12px;border-radius:16px;width:min(320px,70vw)}
.qr svg{display:block;width:100%;height:auto}
.link{color:var(--muted);word-break:break-all}
#bz-status{text-align:center}
.bigbuzz{width:min(72vw,320px);aspect-ratio:1;border-radius:50%;font-size:72px;padding:0;
  background:radial-gradient(circle at 50% 35%,#ff7b7b,#d0242b 70%);box-shadow:0 14px 0 #7a0f14,0 24px 40px -10px #000;transition:transform .05s,box-shadow .05s}
.bigbuzz:active:not(:disabled){transform:translateY(10px);box-shadow:0 4px 0 #7a0f14}
.bigbuzz:disabled{filter:grayscale(1);opacity:.45}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="menu" class="screen center-screen">
  <h1 class="logo">СВОЯ ИГРА</h1>
  <div class="menu-btns">
    <button id="b-play">▶ Начать игру</button>
    <button id="b-edit" class="ghost">✎ Редактор вопросов</button>
    <button id="b-export" class="ghost">⬇ Сохранить пак в файл</button>
    <label class="btnlike ghost">⬆ Загрузить пак из файла<input id="import" type="file" accept=".json,application/json" hidden></label>
  </div>
</div>

<div id="editor" class="screen hidden">
  <header><h1>Редактор вопросов</h1><button class="ghost" data-menu>← В меню</button></header>
  <main id="ed"></main>
</div>

<div id="setup" class="screen hidden center-screen">
  <h2>Игроки</h2>
  <div id="plist"></div>
  <div class="row center"><button id="p-add" class="ghost">+ игрок</button><button id="p-go">Начать</button></div>
  <button class="ghost" data-menu>← В меню</button>
</div>

<div id="game" class="screen hidden">
  <header><h1 id="round-name"></h1><button class="ghost" id="g-phones">📱 Телефоны</button><button id="next-round">Следующий раунд →</button><button class="ghost" id="g-menu">Выйти</button></header>
  <div id="board"></div>
  <div id="scores"></div>
</div>

<div id="results" class="screen hidden center-screen">
  <h1 class="logo">ИТОГИ</h1>
  <div id="res"></div>
  <button data-menu>В меню</button>
</div>

<div id="buzzer" class="screen hidden center-screen">
  <h2 id="bz-status">Подключаемся…</h2>
  <div id="bz-body" class="center-screen" style="min-height:0"></div>
</div>

<div id="modal" class="hidden"><div id="mbody"></div></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const $ = s => document.querySelector(s);
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else e[k] = v;
  }
  for (const k of kids.flat()) if (k != null && k !== false && k !== '') e.append(k);
  return e;
}
const btn = (text, cls, fn) => el('button', {class: cls, onclick: fn}, text);
const show = id => document.querySelectorAll('.screen').forEach(s => s.classList.toggle('hidden', s.id !== id));
const TYPES = {normal: 'Обычный', cat: '🐱 Кот в мешке', x2: '✖️2 Двойная ставка', safe: '🛡 Без риска',
  flip: '🔄 Плюс на минус', swap: '🔀 Обмен счётом', gift: '🎁 Подарок'};
const NOQ = ['flip', 'swap', 'gift']; // модификаторы вместо вопроса — текст не нужен
const has = q => q && (q.text || q.img || NOQ.includes(q.type));

/* ---------- хранение: IndexedDB (картинки не влезут в localStorage) ---------- */
const db = new Promise((res, rej) => {
  const r = indexedDB.open('svoya-igra', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function idb(mode, fn) {
  const d = await db;
  return new Promise((res, rej) => {
    const t = d.transaction('kv', mode), r = fn(t.objectStore('kv'));
    t.oncomplete = () => res(r.result);
    t.onerror = () => rej(t.error);
  });
}
let pack, saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => idb('readwrite', s => s.put(pack, 'pack')).catch(e => alert('Не удалось сохранить: ' + e.message)), 300);
}

const newQ = price => ({price, type: 'normal', text: '', answer: '', img: ''});
const newTheme = n => ({name: '', qs: [1, 2, 3, 4, 5].map(i => newQ(i * 100 * n))});
const newRound = n => ({name: `Раунд ${n}`, themes: [1, 2, 3, 4, 5].map(() => newTheme(n))});
const defaultPack = () => ({rounds: [newRound(1)], final: {theme: '', text: '', answer: '', img: ''}});

/* ---------- редактор ---------- */
function inp(obj, key, ph, type = 'text') {
  return el('input', {type, value: obj[key] ?? '', placeholder: ph,
    oninput: e => { obj[key] = type === 'number' ? Number(e.target.value) || 0 : e.target.value; save(); }});
}
function area(obj, key, ph) {
  return el('textarea', {value: obj[key] ?? '', placeholder: ph, rows: 2, oninput: e => { obj[key] = e.target.value; save(); }});
}
function typeSel(q) {
  const s = el('select', {onchange: e => { q.type = e.target.value; save(); }},
    ...Object.entries(TYPES).map(([v, label]) => el('option', {value: v}, label)));
  s.value = q.type in TYPES ? q.type : 'normal';
  return s;
}
function shrink(file, max = 1280) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = el('canvas', {width: Math.round(img.width * k), height: Math.round(img.height * k)});
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => rej(new Error('не картинка'));
    img.src = URL.createObjectURL(file);
  });
}
function imgPicker(obj) {
  const prev = el('img', {className: 'thumb', src: obj.img || ''});
  const wrap = el('div', {class: 'thumbwrap' + (obj.img ? '' : ' hidden')}, prev,
    el('button', {className: 'bad', title: 'Убрать картинку', onclick: () => { obj.img = ''; save(); wrap.classList.add('hidden'); }}, '✕'));
  const file = el('input', {type: 'file', accept: 'image/*', hidden: true, onchange: async e => {
    const f = e.target.files[0]; if (!f) return;
    try { obj.img = await shrink(f); } catch { return alert('Не получилось открыть картинку'); }
    save(); prev.src = obj.img; wrap.classList.remove('hidden'); e.target.value = '';
  }});
  return el('div', {class: 'img-pick'}, wrap, el('label', {class: 'pick'}, '🖼 Фото', file));
}
function renderEditor() {
  const rerender = () => { save(); renderEditor(); };
  $('#ed').replaceChildren(
    ...pack.rounds.map((r, ri) => el('section', {class: 'card'},
      el('div', {class: 'row'}, inp(r, 'name', 'Название раунда'),
        btn('+ тема', 'ghost', () => { r.themes.push(newTheme(ri + 1)); rerender(); }),
        btn('🗑 Раунд', 'del', () => confirm(`Удалить «${r.name}» со всеми вопросами?`) && (pack.rounds.splice(ri, 1), rerender()))),
      ...r.themes.map((t, ti) => el('div', {class: 'theme'},
        el('div', {class: 'row'}, inp(t, 'name', `Тема ${ti + 1}`),
          btn('+ вопрос', 'ghost', () => { t.qs.push(newQ((t.qs.at(-1)?.price || 0) + 100 * (ri + 1))); rerender(); }),
          btn('🗑 Тема', 'del', () => confirm('Удалить тему?') && (r.themes.splice(ti, 1), rerender()))),
        el('div', {class: 'q qh'}, ...['Цена', 'Тип', 'Вопрос', 'Ответ', 'Картинка'].map(s => el('span', {}, s))),
        ...t.qs.map((q, qi) => el('div', {class: 'q'},
          inp(q, 'price', 'Цена', 'number'), typeSel(q), area(q, 'text', 'Вопрос'), area(q, 'answer', 'Ответ'), imgPicker(q),
          el('button', {className: 'del', title: 'Удалить вопрос', onclick: () => confirm('Удалить вопрос?') && (t.qs.splice(qi, 1), rerender())}, '✕'))))))),
    btn('+ Добавить раунд', 'addround', () => { pack.rounds.push(newRound(pack.rounds.length + 1)); rerender(); }),
    el('section', {class: 'card'}, el('h2', {}, 'Финал'),
      el('div', {class: 'q', style: 'grid-template-columns:1fr 1fr 1fr auto;margin-left:0'},
        inp(pack.final, 'theme', 'Тема финала'), area(pack.final, 'text', 'Вопрос'), area(pack.final, 'answer', 'Ответ'), imgPicker(pack.final)))
  );
}

/* ---------- игроки ---------- */
let names = ['Игрок 1', 'Игрок 2', 'Игрок 3'];
function renderSetup() {
  $('#plist').replaceChildren(...names.map((n, i) => el('div', {class: 'row'},
    el('input', {value: n, oninput: e => names[i] = e.target.value}),
    btn('✕', 'bad', () => { names.splice(i, 1); renderSetup(); }))));
}

/* ---------- игра ---------- */
let state;
const closeModal = () => { $('#modal').classList.add('hidden'); buzzStop(); };
const modal = (...kids) => { $('#mbody').replaceChildren(...kids); $('#modal').classList.remove('hidden'); };
const lock = node => node.querySelectorAll('button').forEach(b => b.disabled = true);

function renderScores() {
  $('#scores').replaceChildren(...state.players.map(p => el('div', {class: 'player'},
    el('div', {class: 'pname'}, p.name),
    el('input', {type: 'number', className: 'pscore', value: p.score, title: 'Можно поправить вручную',
      onchange: e => p.score = Number(e.target.value) || 0}))));
}
function renderGame() {
  const r = pack.rounds[state.ri];
  $('#round-name').textContent = r.name;
  $('#next-round').textContent = state.ri + 1 < pack.rounds.length ? 'Следующий раунд →' : (has(pack.final) ? 'К финалу →' : 'Завершить игру →');
  const themes = r.themes.map((t, ti) => [t, ti]).filter(([t]) => t.qs.some(has));
  const n = Math.max(1, ...themes.map(([t]) => t.qs.length));
  const b = $('#board');
  b.style.gridTemplateColumns = `minmax(120px,1.6fr) repeat(${n},1fr)`;
  b.replaceChildren(...themes.flatMap(([t, ti]) => [
    el('div', {class: 'tname'}, t.name),
    ...Array.from({length: n}, (_, qi) => {
      const q = t.qs[qi], key = `${state.ri}:${ti}:${qi}`, off = !has(q) || state.used.has(key);
      return el('button', {class: 'cell', disabled: off, onclick: () => openQ(t, q, key)}, off ? '' : String(q.price));
    })
  ]));
  renderScores();
}
function openQ(t, q, key) {
  const done = () => { state.used.add(key); closeModal(); renderGame(); };
  const head = el('div', {class: 'qhead'}, `${t.name} · ${q.price}`);
  if (q.type === 'cat') return modal(el('h2', {class: 'special'}, '🐱 Кот в мешке'), head,
    el('p', {}, 'Кому отдаёте вопрос?'),
    el('div', {class: 'row center'}, ...state.players.map(p => btn(p.name, '', () => ask(t, q, [p], q.price, done)))));
  // модификаторы: экран-заставка и выбор игрока
  const pick = (title, desc, fn, ps = state.players) => modal(el('h2', {class: 'special'}, title), head,
    el('p', {class: 'qtext'}, desc),
    el('div', {class: 'row center'}, ...ps.map(p => btn(`${p.name} (${p.score})`, '', () => fn(p)))));
  const intro = (title, desc, next) => modal(el('h2', {class: 'special'}, title), head,
    el('p', {class: 'qtext'}, desc), btn('Показать вопрос', '', next));
  if (q.type === 'flip') return pick('🔄 Плюс на минус', 'У кого меняем знак счёта?', p => { p.score = -p.score; done(); });
  if (q.type === 'gift') return pick('🎁 Подарок', `Кому дарим ${q.price}?`, p => { p.score += q.price; done(); });
  if (q.type === 'swap') return pick('🔀 Обмен счётом', 'Кто меняется?', a =>
    pick('🔀 Обмен счётом', `${a.name} меняется счётом с…`, b => { [a.score, b.score] = [b.score, a.score]; done(); },
      state.players.filter(p => p !== a)));
  if (q.type === 'x2') return intro('✖️2 Двойная ставка', `Вопрос стоит ${q.price * 2} — и в плюс, и в минус`, () => ask(t, q, state.players, q.price * 2, done));
  if (q.type === 'safe') return intro('🛡 Без риска', 'За неверный ответ баллы не снимаются', () => ask(t, q, state.players, q.price, done, true));
  ask(t, q, state.players, q.price, done);
}
function ask(t, q, players, price, done, safe = false) {
  const ans = el('div', {class: 'answer hidden'}, 'Ответ: ' + (q.answer || '—'));
  const reveal = () => ans.classList.remove('hidden');
  let left = players.length;
  const rows = new Map();
  const judge = el('div', {class: 'judge'}, ...players.map(p => {
    const row = el('div', {class: 'jrow'}, el('span', {}, p.name),
      btn(`✓ +${price}`, 'ok', () => { p.score += price; lock(judge); reveal(); renderScores(); buzzStop(); }),
      btn(safe ? '✗ мимо' : `✗ −${price}`, 'bad', () => { if (!safe) p.score -= price; lock(row); row.classList.remove('first'); buzzOut(p); renderScores(); if (--left === 0) reveal(); }));
    rows.set(p, row);
    return row;
  }));
  modal(el('div', {class: 'qhead'}, `${t.name} · ${price}`),
    q.text && el('div', {class: 'qtext'}, q.text),
    q.img && el('img', {className: 'qimg', src: q.img}),
    ans,
    el('div', {class: 'mfoot'}, judge,
      el('div', {class: 'row center'}, btn('Показать ответ', 'ghost', reveal), btn('Закрыть вопрос', '', done))));
  buzzStart(players, p => { rows.get(p).classList.add('first'); beep(); });
}

/* ---------- кнопки на телефонах (PeerJS: телефоны подключаются к ноутбуку напрямую) ---------- */
let peer, conns = [], buzz = {open: false, first: null, out: new Set()};
function sync() {
  if (!state) return;
  const m = {players: state.players.map(p => p.name), open: buzz.open && !buzz.first, first: buzz.first?.name ?? null, out: [...buzz.out].map(p => p.name)};
  conns.forEach(c => c.open && c.send(m));
}
const buzzStart = (players, onFirst) => { buzz = {open: players.length > 1, first: null, out: new Set(), onFirst}; sync(); };
const buzzStop = () => { buzz.open = false; sync(); };
const buzzOut = p => { buzz.out.add(p); if (buzz.first === p) buzz.first = null; sync(); };
function onBuzz(name) {
  const p = state?.players.find(p => p.name === name);
  if (!p || !buzz.open || buzz.first || buzz.out.has(p)) return; // кто первым дошёл до ноутбука — тот и первый
  buzz.first = p; buzz.onFirst?.(p); sync();
}
function beep() {
  try { const a = new AudioContext(), o = a.createOscillator(); o.frequency.value = 880; o.connect(a.destination); o.start(); o.stop(a.currentTime + .15); } catch {}
}
const phonesCount = () => { $('#g-phones').textContent = `📱 Телефоны: ${conns.length}`; const e = $('#pcount'); if (e) e.textContent = `Подключено: ${conns.length}`; };
function phones() {
  if (location.protocol === 'file:') return alert('Телефоны работают, только когда игра открыта по ссылке (Render), а не из файла');
  if (!window.Peer || !window.qrcode) return alert('Не загрузились библиотеки — проверьте интернет');
  if (!peer) {
    peer = new Peer('svoyak-' + Math.random().toString(36).slice(2, 8));
    peer.on('open', phones);
    peer.on('error', e => alert('Ошибка связи с телефонами: ' + e.type));
    peer.on('connection', c => {
      c.on('open', () => { conns.push(c); phonesCount(); sync(); });
      c.on('data', m => m?.buzz && onBuzz(m.buzz));
      c.on('close', () => { conns = conns.filter(x => x !== c); phonesCount(); });
    });
    return modal(el('h2', {class: 'special'}, '📱 Телефоны'), el('p', {}, 'Подключаемся…'));
  }
  if (!peer.id) return;
  const url = location.origin + location.pathname + '?join=' + peer.id;
  const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
  const box = el('div', {class: 'qr'}); box.innerHTML = qr.createSvgTag({cellSize: 8, margin: 2, scalable: true});
  modal(el('h2', {class: 'special'}, '📱 Телефоны'), el('p', {}, 'Отсканируйте камерой телефона и выберите себя'), box,
    el('a', {href: url, target: '_blank', class: 'link'}, url), el('p', {id: 'pcount'}, `Подключено: ${conns.length}`), btn('Готово', '', closeModal));
}

/* ---------- экран телефона (?join=ID) ---------- */
function phone(id) {
  show('buzzer');
  let me = null, st = {players: [], out: []}, conn;
  const status = t => $('#bz-status').textContent = t;
  const render = () => {
    if (!st.players.includes(me)) {
      me = null; status('Кто вы?');
      return $('#bz-body').replaceChildren(el('div', {class: 'menu-btns'}, ...st.players.map(n => btn(n, 'ghost', () => { me = n; render(); }))));
    }
    const can = st.open && !st.out.includes(me);
    status(st.first ? (st.first === me ? 'Ты первый! 🎉' : 'Первым: ' + st.first) : can ? 'Жми!' : 'Ждём вопрос…');
    $('#bz-body').replaceChildren(el('div', {class: 'pname'}, me),
      el('button', {class: 'bigbuzz', disabled: !can, onclick: () => { navigator.vibrate?.(60); conn.send({buzz: me}); }}, '🔔'),
      btn('сменить игрока', 'ghost', () => { me = null; render(); }));
  };
  if (!window.Peer) return status('Нет интернета — обновите страницу');
  const p = new Peer();
  p.on('open', () => {
    conn = p.connect(id, {reliable: true});
    conn.on('open', () => status('Подключено, ждём игру…'));
    conn.on('data', m => { st = m; render(); });
    conn.on('close', () => status('Связь потеряна — обновите страницу'));
  });
  p.on('error', e => status('Ошибка: ' + e.type + ' — обновите страницу'));
}
function startFinal() {
  const f = pack.final, ps = state.players.filter(p => p.score > 0);
  if (!has(f) || !ps.length) return results();
  const bets = ps.map(p => el('input', {type: 'number', min: 0, max: p.score, value: 0}));
  modal(el('h2', {class: 'special'}, 'Финал'), el('div', {class: 'qtext'}, 'Тема: ' + (f.theme || '—')),
    el('p', {}, 'Ставки (от 0 до своего счёта). Игроки с 0 и минусом не участвуют.'),
    el('div', {class: 'judge'}, ...ps.map((p, i) => el('div', {class: 'jrow'}, el('span', {}, `${p.name} (${p.score})`), bets[i]))),
    btn('Показать вопрос', '', () => finalQ(f, ps, bets.map((x, i) => Math.min(ps[i].score, Math.max(0, Number(x.value) || 0))))));
}
function finalQ(f, ps, bets) {
  const ans = el('div', {class: 'answer hidden'}, 'Ответ: ' + (f.answer || '—'));
  modal(el('div', {class: 'qhead'}, 'Финал · ' + (f.theme || '')),
    f.text && el('div', {class: 'qtext'}, f.text),
    f.img && el('img', {className: 'qimg', src: f.img}),
    ans,
    el('div', {class: 'mfoot'},
      el('div', {class: 'judge'}, ...ps.map((p, i) => {
        const row = el('div', {class: 'jrow'}, el('span', {}, `${p.name} (ставка ${bets[i]})`),
          btn('✓ верно', 'ok', () => { p.score += bets[i]; lock(row); }),
          btn('✗ неверно', 'bad', () => { p.score -= bets[i]; lock(row); }));
        return row;
      })),
      el('div', {class: 'row center'}, btn('Показать ответ', 'ghost', () => ans.classList.remove('hidden')), btn('Итоги', '', results))));
}
function results() {
  closeModal();
  const s = [...state.players].sort((a, b) => b.score - a.score);
  $('#res').replaceChildren(...s.map((p, i) => el('div', {class: i ? 'res' : 'res win'}, `${i ? '' : '🏆 '}${p.name} — ${p.score}`)));
  show('results');
}

/* ---------- кнопки ---------- */
document.querySelectorAll('[data-menu]').forEach(b => b.onclick = () => show('menu'));
$('#b-edit').onclick = () => { renderEditor(); show('editor'); };
$('#b-play').onclick = () => {
  if (!pack.rounds.some(r => r.themes.some(t => t.qs.some(has)))) return alert('Сначала добавьте вопросы в редакторе');
  renderSetup(); show('setup');
};
$('#p-add').onclick = () => { names.push(`Игрок ${names.length + 1}`); renderSetup(); };
$('#p-go').onclick = () => {
  const ps = names.map(n => n.trim()).filter(Boolean);
  if (!ps.length) return alert('Добавьте хотя бы одного игрока');
  state = {players: ps.map(name => ({name, score: 0})), ri: 0, used: new Set()};
  renderGame(); show('game'); sync();
};
$('#g-phones').onclick = phones;
$('#next-round').onclick = () => {
  if ($('#board .cell:not(:disabled)') && !confirm('В раунде остались вопросы. Всё равно дальше?')) return;
  if (state.ri + 1 < pack.rounds.length) { state.ri++; renderGame(); } else startFinal();
};
$('#g-menu').onclick = () => confirm('Выйти из игры? Счёт пропадёт.') && show('menu');
$('#b-export').onclick = () => {
  const a = el('a', {href: URL.createObjectURL(new Blob([JSON.stringify(pack)], {type: 'application/json'})), download: 'svoya-igra-pack.json'});
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#import').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !confirm('Заменить текущие вопросы вопросами из файла?')) return;
  try {
    const p = JSON.parse(await f.text());
    if (!Array.isArray(p.rounds)) throw 0;
    p.final ??= {theme: '', text: '', answer: '', img: ''};
    pack = p; save(); alert('Пак загружен');
  } catch { alert('Это не файл пака'); }
};

idb('readonly', s => s.get('pack')).catch(() => null).then(p => { pack = p || defaultPack(); });
const joinId = new URLSearchParams(location.search).get('join');
if (joinId) phone(joinId);
</script>
